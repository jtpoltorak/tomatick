<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tomomomento has moved</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://tomomomento.com/" />
    <meta http-equiv="refresh" content="0; url=https://tomomomento.com/" />
    <script>
      // Keep the page being asked for (e.g. legal.html#privacy) on the new site.
      const path = location.pathname.replace(/^\/[^/]+/, '') || '/';
      location.replace('https://tomomomento.com' + path + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Tomomomento has moved to <a href="https://tomomomento.com/">tomomomento.com</a>.</p>
  </body>
</html>
