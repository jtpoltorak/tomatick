<header class="topbar">
  @if (view() === 'settings') {
    <button class="icon-btn ghost" (click)="show('timer')" aria-label="Back to timer" title="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z" />
      </svg>
    </button>
    <h1>Settings</h1>
  } @else {
    <img src="icons/icon-32.png" width="20" height="20" alt="" />
    <h1>Pomodoro</h1>
    <button
      class="icon-btn ghost"
      (click)="show('settings')"
      aria-label="Settings"
      title="Settings"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.3-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
          transform="translate(-1 0)"
        />
      </svg>
    </button>
  }
</header>

@if (store.loaded()) {
  @if (view() === 'settings') {
    <app-settings-view />
  } @else {
    <app-timer-view (openSettings)="show('settings')" />
  }
}
